
server:
  port: 8082

spring:
  application:
    name: currency-conversion-service
  cloud:
    openfeign:
      micrometer:
        enabled: true

currency-exchange:
  # Base URL of the Currency Exchange Service.
  url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0

  # Zipkin server endpoint
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
