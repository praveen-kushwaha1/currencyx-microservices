spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Forward exchange API requests to the Exchange Service.
        - id: currency-exchange-route
          uri: lb://CURRENCY-EXCHANGE-SERVICE
          predicates:
            - Path=/currency-exchange/**

        # Forward conversion API requests to the Conversion Service, protected by a Circuit Breaker.
        - id: currency-conversion-route
          uri: lb://CURRENCY-CONVERSION-SERVICE
          predicates:
            - Path=/api/conversion/**
          filters:
            # Protect this route with a reactive circuit breaker.
            - name: CircuitBreaker
              args:
                name: conversionGatewayCircuitBreaker
                fallbackUri: forward:/fallback/conversion
                statusCodes:
                  - "500"
                  - "502"
                  - "503"
                  - "504"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Resilience4j circuit breaker configuration.
resilience4j:
  circuitbreaker:
    instances:
      conversionGatewayCircuitBreaker:
        # Examine the last 10 recorded calls.
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10

        # Wait for at least 5 calls before evaluating failures.
        minimumNumberOfCalls: 5

        # Open the circuit when at least 50% of calls fail.
        failureRateThreshold: 50

        # Wait 10 seconds before trying recovery.
        waitDurationInOpenState: 10s

        # Permit 3 trial calls during recovery.
        permittedNumberOfCallsInHalfOpenState: 3

        # Automatically transition to HALF_OPEN after the wait.
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Expose basic health and metrics endpoints for development.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics