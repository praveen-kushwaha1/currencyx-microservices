services:

  # Stores and indexes application logs.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: currencyx-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - currencyx-es-data:/usr/share/elasticsearch/data
    networks:
      - currencyx-elk

  # Collects logs from CurrencyX microservices.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: currencyx-logstash
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - currencyx-elk

  # Provides a UI for searching and visualizing logs.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: currencyx-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - currencyx-elk

volumes:
  currencyx-es-data:

networks:
  currencyx-elk:
    driver: bridge