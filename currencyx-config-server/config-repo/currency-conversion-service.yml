
server:
  port: 8082

spring:
  application:
    name: currency-conversion-service

currency-exchange:
  # Base URL of the Currency Exchange Service.
  url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
