input {
    # Receive JSON logs from Spring Boot applications.
    tcp {
        port => 5000
        codec => json_lines
    }
}

filter {
    # Identify the service if the application sends its name.
    if ![application] {
        mutate {
            add_field => {
                "application" => "currencyx-unknown"
            }
        }
    }
}

output {
    # Store logs in Elasticsearch.
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "currencyx-logs-%{+YYYY.MM.dd}"
    }

    # Print received logs for debugging.
    stdout {
        codec => rubydebug
    }
}